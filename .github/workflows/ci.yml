name: CI

on:
  schedule:
    - cron: '43 5 * * 2'
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      SECRET_KEY: test-secret
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1 libheif1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          python - <<'PYLOCK'
          from importlib.metadata import version
          from pathlib import Path
          from pip._vendor.packaging.requirements import Requirement
          for line in Path('requirements.in').read_text().splitlines():
              line = line.split('#', 1)[0].strip()
              if not line:
                  continue
              req = Requirement(line)
              if req.marker is None or req.marker.evaluate():
                  assert version(req.name) in req.specifier, f"Regenerate requirements.txt for {req}"
          PYLOCK
      - name: Run backend unit tests
        run: pytest -m backend

  integration-tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      SECRET_KEY: test-secret
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1 libheif1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          python - <<'PYLOCK'
          from importlib.metadata import version
          from pathlib import Path
          from pip._vendor.packaging.requirements import Requirement
          for line in Path('requirements.in').read_text().splitlines():
              line = line.split('#', 1)[0].strip()
              if not line:
                  continue
              req = Requirement(line)
              if req.marker is None or req.marker.evaluate():
                  assert version(req.name) in req.specifier, f"Regenerate requirements.txt for {req}"
          PYLOCK
      - name: Run integration suite
        run: pytest -m integration

  frontend-tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      SECRET_KEY: test-secret
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1 libheif1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          python - <<'PYLOCK'
          from importlib.metadata import version
          from pathlib import Path
          from pip._vendor.packaging.requirements import Requirement
          for line in Path('requirements.in').read_text().splitlines():
              line = line.split('#', 1)[0].strip()
              if not line:
                  continue
              req = Requirement(line)
              if req.marker is None or req.marker.evaluate():
                  assert version(req.name) in req.specifier, f"Regenerate requirements.txt for {req}"
          PYLOCK
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --run

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image with pinned native security fixes
        run: docker build --pull -t receipt-production-test .
      - name: Verify actual production codecs, CA trust and allowed HEIC conversion
        run: docker run --rm --network none --entrypoint python receipt-production-test docker/verify_image_runtime.py
      - name: Run backend, OCR and finalize regressions in the production artifact
        run: >-
          docker run --rm --network none
          -v "$PWD:/testapp" -w /testapp -e SECRET_KEY=local-production-image-test
          --entrypoint python receipt-production-test
          -m pytest -m 'not integration and not perf'
