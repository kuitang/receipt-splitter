name: Deploy Review App
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # Set this to your Fly.io preferred region.
  FLY_REGION: ewr

jobs:
  review_app:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-${{ github.event.number }}
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Refresh preview build layers for this workflow attempt
        if: github.event.action != 'closed'
        run: |
          printf '\n[build.args]\n  SECURITY_REBUILD = "%s-%s"\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> fly.review.toml

      - name: Deploy PR app to Fly.io
        id: deploy
        uses: superfly/fly-pr-review-apps@1.6.0
        with:
          config: fly.review.toml
          launch_options: --no-object-storage
          memory: 512

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set secrets on review app
        if: github.event.action != 'closed'
        run: |
          APP_NAME="pr-${{ github.event.number }}-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          UPDATE_LOG=$(mktemp)
          for ATTEMPT in $(seq 1 15); do
            if flyctl secrets set \
              GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              AWS_ENDPOINT_URL_S3="${{ secrets.AWS_ENDPOINT_URL_S3 }}" \
              AWS_REGION="${{ secrets.AWS_REGION }}" \
              BUCKET_NAME="${{ secrets.BUCKET_NAME }}" \
              -a "$APP_NAME" > "$UPDATE_LOG" 2>&1; then
              rm -f "$UPDATE_LOG"
              echo "Review app secrets applied."
              break
            fi
            if ! grep -q 'machine is replacing: concurrent update in progress' "$UPDATE_LOG"; then
              rm -f "$UPDATE_LOG"
              echo "::error::Review secret update failed with a non-transient Fly error."
              exit 1
            fi
            if [ "$ATTEMPT" -eq 15 ]; then
              rm -f "$UPDATE_LOG"
              echo "::error::Fly review Machine replacement did not finish within the retry budget."
              exit 1
            fi
            echo "Waiting for the Fly review Machine replacement (attempt $ATTEMPT/15)."
            sleep 2
          done

      - name: Allocate shared IPv4 for preview app
        if: github.event.action != 'closed'
        run: |
          APP_NAME="pr-${{ github.event.number }}-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          echo "Allocating shared IPv4 for app: $APP_NAME"
          flyctl ips allocate-v4 --shared -a "$APP_NAME" || echo "IPv4 allocation failed or already exists"

      - name: Destroy preview database resources
        if: github.event.action == 'closed'
        run: |
          APP_NAME="pr-${{ github.event.number }}-${{ github.repository_owner }}-${{ github.event.repository.name }}"
          DB_APP_NAME="${APP_NAME}-db"
          echo "Cleaning up database app: $DB_APP_NAME"

          APPS=$(flyctl apps list --json)
          if jq -e --arg db "$DB_APP_NAME" 'any(.[]; .Name == $db)' <<< "$APPS" >/dev/null; then
            flyctl apps destroy "$DB_APP_NAME" --yes
          fi
